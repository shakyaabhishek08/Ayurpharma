<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ayurvedic AI Consultation</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
      background: #0d0d0d;
      color: #e6e6e6;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 16px 24px;
      background: #111;
      border-bottom: 1px solid #222;
      font-size: 18px;
      font-weight: 600;
      color: #00e676;
      text-align: center;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .message {
      max-width: 70%;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.5;
      animation: fadeIn 0.3s ease;
    }
    .user {
      background: #1e1e1e;
      align-self: flex-end;
      border: 1px solid #333;
    }
    .ai {
      background: #162a1f;
      border: 1px solid #234;
      color: #b8f5c4;
      align-self: flex-start;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .input-bar {
      padding: 16px;
      display: flex;
      gap: 12px;
      border-top: 1px solid #222;
      background: #111;
    }
    .input-bar input {
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    .input-bar button {
      padding: 0 22px;
      background: #00e676;
      border: none;
      border-radius: 10px;
      color: #111;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }
    .input-bar button:hover {
      background: #00c968;
    }

    .loader {
      border: 3px solid #222;
      border-top: 3px solid #00e676;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      margin-left: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <header>🌿 Ayurvedic AI Consultation</header>
  <main>
    <div class="chat-window" id="chatWindow">
      <!-- Chat messages will appear here -->
    </div>
    <div class="input-bar">
      <input type="text" id="disease" placeholder="Describe your symptoms..." />
      <button onclick="askQuestion()">Send</button>
    </div>
  </main>

  <script>
    const chatWindow = document.getElementById("chatWindow");
    const input = document.getElementById("disease");

    function appendMessage(content, sender) {
      const msg = document.createElement("div");
      msg.classList.add("message", sender);
      msg.innerHTML = content;
      chatWindow.appendChild(msg);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    async function askQuestion() {
      const disease = input.value.trim();
      if (!disease) return;

      appendMessage(disease, "user");
      input.value = "";

      // Loader bubble
      const loader = document.createElement("div");
      loader.classList.add("message", "ai");
      loader.innerHTML = '<div class="loader"></div>';
      chatWindow.appendChild(loader);
      chatWindow.scrollTop = chatWindow.scrollHeight;

      try {
        const response = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: disease })
        });
        const data = await response.json();
        loader.remove();

        if (data.error) {
          appendMessage(`<strong>Error:</strong> ${data.error}`, "ai");
        } else {
          const med = data.medicine || {};
          appendMessage(`
            <strong>Matched Symptom:</strong> ${data.symptom || "—"}<br/>
            <strong>Explanation:</strong> ${data.symptom_explanation || "—"}<br/>
            <strong>Recommended Medicine:</strong> ${med.name || "—"}<br/>
            <strong>Dose:</strong> ${med.dose || "—"}<br/>
            <strong>Precaution:</strong> ${med.precaution || "—"}<br/>
            <em>Similarity Score:</em> ${data.meta?.symptom_similarity ?? "n/a"}
          `, "ai");
        }
      } catch (err) {
        loader.remove();
        appendMessage("<strong>Error:</strong> Something went wrong.", "ai");
      }
    }

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        askQuestion();
      }
    });
  </script>
</body>
</html>
